<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PeakOS</title>
    <script>
      var path = window.location.pathname;
      // Só redireciona se não estiver já em /PeakOS/
      if (path.indexOf('/PeakOS') === -1) {
        sessionStorage.redirect = path + window.location.search + window.location.hash;
        window.location.replace('/PeakOS/');
      } else {
        sessionStorage.redirect = path + window.location.search + window.location.hash;
        window.location.replace('/PeakOS/');
      }
    </script>
  </head>
</html>

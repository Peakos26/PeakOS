<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <script>
    var path = window.location.pathname;
    // Redirecionar para o index se não estiver no path correto
    if (!path.startsWith('/PeakOS')) {
      sessionStorage.setItem('redirect', location.pathname)
      location.href = '/PeakOS/'
    }
  </script>
</head>
<body>
  <p>Page Not Found</p>
</body>
</html>
